profiles:
  - id: arrhenius
    name: Arrhenius (NAISS)
    kind: slurm
    host: login.hpc.arrhenius.naiss.se
    port: 22
    username: nilsdu
    data_roots:
      - /nobackup/proj/disk/naiss2024-5-630/personal/nilsdu/TIMED/zarr
      - /nobackup/proj/disk/naiss2024-5-630/personal/nilsdu/biomorph/idr0080
    metadata_root: /nobackup/proj/disk/naiss2024-5-630/personal/nilsdu/TIMED/metadata
    collections:
      - id: timed
        title: TIMED
        description: Live-cell time-lapse · 8 plates · 48 h, hourly · 3 channels
        path: /nobackup/proj/disk/naiss2024-5-630/personal/nilsdu/TIMED/zarr
        default: true
      - id: idr0080
        title: Cell Health
        description: idr0080 CRISPR Cell Painting - A549, ES2, HCC44 - 9 plates - 5 channels
        path: /nobackup/proj/disk/naiss2024-5-630/personal/nilsdu/biomorph/idr0080/idr0080-raw.index.parquet
        qc_export: /nobackup/proj/disk/naiss2024-5-630/personal/nilsdu/scratch/qc_metrics_compute/website_export
        qc_annotations: /nobackup/proj/disk/naiss2024-5-630/personal/nilsdu/scratch/qc_review/annotations
    slurm:
      account: naiss2026-3-679-cpu
      partition: cpu
      time: "04:00:00"
      cpus: 2
      mem: 8G
    remote_state_dir: ~/.timed
    auto_install_uv: true
    module_loads: []

  - id: berzelius
    name: Berzelius (NSC)
    kind: slurm
    host: berzelius.nsc.liu.se
    port: 22
    username: x_nildu
    data_roots:
      - /proj/berzelius-2026-62/users/x_nildu/TIMED/zarr
    metadata_root: /proj/berzelius-2026-62/users/x_nildu/TIMED/metadata
    collections:
      - id: timed
        title: TIMED
        description: Live-cell time-lapse · PB100140_P2.1 · 48 h, hourly · 3 channels
        path: /proj/berzelius-2026-62/users/x_nildu/TIMED/zarr
        default: true
    slurm:
      account: berzelius-2026-299
      partition: berzelius-cpu
      time: "08:00:00"
      cpus: 2
    remote_state_dir: ~/.timed
    auto_install_uv: true
    module_loads: []

  - id: local-timed
    name: Local TIMED (external drive)
    kind: local
    data_roots:
      - "D:/TIMED/zarr"
    metadata_root: "D:/TIMED/metadata"
    collections:
      - id: timed
        title: TIMED
        description: Live-cell time-lapse · PB100140_P2.1 · 48 h, hourly · 3 channels
        path: "D:/TIMED/zarr"
        default: true

  - id: test-cluster
    name: Test cluster (local SSH/Slurm harness)
    kind: slurm
    host: 127.0.0.1
    port: 2222
    username: dev
    known_hosts: ./dev/test_cluster/.state/known_hosts
    data_roots: [/absolute/path/to/repo/test-data]
    metadata_root: /absolute/path/to/repo/test-data/metadata
    slurm:
      account: dev
      partition: cpu
      time: "01:00:00"
      cpus: 2
      mem: 4G

  - id: local
    name: This computer
    kind: local
    data_roots: [./test-data]
    metadata_root: ./test-data/metadata

  - id: test-cluster-datasets
    name: Test cluster with datasets
    kind: slurm
    host: 127.0.0.1
    port: 2222
    username: dev
    known_hosts: ./dev/test_cluster/.state/known_hosts
    data_roots: [/absolute/path/to/repo/test-data]
    metadata_root: /absolute/path/to/repo/test-data/metadata
    collections:
      - id: timed
        title: TIMED
        description: Live-cell time-lapse · test fixture · 3 channels
        path: /absolute/path/to/repo/test-data
        default: true
      - id: idr0080
        title: Cell Health
        description: idr0080-like CRISPR Cell Painting fixture
        path: /absolute/path/to/repo/test-data/packed/idr0080-like/idr0080-raw.index.parquet
        qc_export: /absolute/path/to/repo/test-data/qc-export
        qc_annotations: /absolute/path/to/repo/.timed/qc-annotations
    slurm:
      account: dev
      partition: cpu
      time: "01:00:00"
      cpus: 2
      mem: 4G

  - id: local-datasets
    name: This computer with datasets
    kind: local
    data_roots: [./test-data]
    metadata_root: ./test-data/metadata
    collections:
      - id: timed
        title: TIMED
        description: Live-cell time-lapse · test fixture · 3 channels
        path: ./test-data
        default: true
      - id: idr0080
        title: Cell Health
        description: idr0080-like CRISPR Cell Painting fixture
        path: ./test-data/packed/idr0080-like/idr0080-raw.index.parquet
        qc_export: ./test-data/qc-export
        qc_annotations: ./.timed/qc-annotations
