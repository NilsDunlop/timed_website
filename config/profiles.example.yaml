profiles:
  - id: arrhenius
    name: Arrhenius (NAISS)
    kind: slurm
    host: login.hpc.arrhenius.naiss.se
    port: 22
    username: nilsdu
    data_roots:
      - /nobackup/proj/disk/naiss2024-5-630/personal/nilsdu/TIMED/zarr
    metadata_root: /nobackup/proj/disk/naiss2024-5-630/personal/nilsdu/TIMED/metadata
    slurm:
      account: naiss2026-3-679-cpu
      partition: cpu
      time: "04:00:00"
      cpus: 2
      mem: 8G
    remote_state_dir: ~/.timed
    auto_install_uv: true
    module_loads: []

  - id: test-cluster
    name: Test cluster (local SSH/Slurm harness)
    kind: slurm
    host: 127.0.0.1
    port: 2222
    username: dev
    known_hosts: ./dev/test_cluster/.state/known_hosts
    data_roots: [/absolute/path/to/repo/test-data]
    metadata_root: /absolute/path/to/repo/test-data/metadata
    slurm:
      account: dev
      partition: cpu
      time: "01:00:00"
      cpus: 2
      mem: 4G

  - id: local
    name: This computer
    kind: local
    data_roots: [./test-data]
    metadata_root: ./test-data/metadata
