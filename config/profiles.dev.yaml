# Development profiles: the local SSH/Slurm test cluster and the synthetic
# test-data fixtures. Replace /absolute/path/to/repo with this checkout's path
# for the cluster profiles, then run:
#   uv run python scripts/dev.py --profiles config/profiles.dev.yaml
profiles:
  - id: test-cluster
    name: Test cluster (local SSH/Slurm harness)
    kind: slurm
    host: 127.0.0.1
    port: 2222
    username: dev
    known_hosts: ./dev/test_cluster/.state/known_hosts
    data_roots: [/absolute/path/to/repo/test-data]
    metadata_root: /absolute/path/to/repo/test-data/metadata
    slurm:
      account: dev
      partition: cpu
      time: "01:00:00"
      cpus: 2
      mem: 4G

  - id: local
    name: This computer
    kind: local
    data_roots: [./test-data]
    metadata_root: ./test-data/metadata

  - id: test-cluster-datasets
    name: Test cluster with datasets
    kind: slurm
    host: 127.0.0.1
    port: 2222
    username: dev
    known_hosts: ./dev/test_cluster/.state/known_hosts
    data_roots: [/absolute/path/to/repo/test-data]
    metadata_root: /absolute/path/to/repo/test-data/metadata
    collections:
      - id: timed
        title: TIMED
        description: Live-cell time-lapse · test fixture · 3 channels
        path: /absolute/path/to/repo/test-data
        default: true
        masks_root: /absolute/path/to/repo/test-data/timed-masks
        segmentation_root: /absolute/path/to/repo/test-data/timed-seg
      - id: idr0080
        title: Cell Health
        description: idr0080-like CRISPR Cell Painting fixture
        path: /absolute/path/to/repo/test-data/packed/idr0080-like/idr0080-raw.index.parquet
        qc_export: /absolute/path/to/repo/test-data/qc-export
        qc_annotations: /absolute/path/to/repo/.timed/qc-annotations
    slurm:
      account: dev
      partition: cpu
      time: "01:00:00"
      cpus: 2
      mem: 4G

  - id: local-datasets
    name: This computer with datasets
    kind: local
    data_roots: [./test-data]
    metadata_root: ./test-data/metadata
    collections:
      - id: timed
        title: TIMED
        description: Live-cell time-lapse · test fixture · 3 channels
        path: ./test-data
        default: true
        masks_root: ./test-data/timed-masks
        segmentation_root: ./test-data/timed-seg
      - id: idr0080
        title: Cell Health
        description: idr0080-like CRISPR Cell Painting fixture
        path: ./test-data/packed/idr0080-like/idr0080-raw.index.parquet
        qc_export: ./test-data/qc-export
        qc_annotations: ./.timed/qc-annotations
