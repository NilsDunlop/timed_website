[project]
name = "timed-platform"
version = "0.1.0"
description = "Workspace for the TIMED OME-Zarr imaging platform"
requires-python = ">=3.12"
dependencies = [
  "timed-connector==0.1.0",
  "timed-dataserver==0.8.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["services/connector", "services/dataserver"]

[tool.uv.sources]
timed-connector = { workspace = true }
timed-dataserver = { workspace = true }

[dependency-groups]
dev = [
  "ome-zarr==0.19.2",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.10",
]

[tool.pytest.ini_options]
addopts = "-ra"
markers = [
  "needs_symlinks: creates symlinks; skips where the platform refuses them (Windows)",
  "posix_only: runs only on POSIX; skips on Windows",
]
testpaths = ["scripts/tests", "services/connector/tests", "services/dataserver/tests"]
pythonpath = [
  ".",
  "services/connector/src",
  "services/dataserver/src",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.per-file-target-version]
"scripts/inspect_omezarr.py" = "py38"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
