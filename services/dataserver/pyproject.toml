[project]
name = "timed-dataserver"
version = "0.4.0.dev0"
description = "Token-protected OME-Zarr data service for TIMED"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.142.2",
  "pyarrow==26.0.0",
  "pydantic==2.12.5",
  "tifffile==2026.10.15",
  "uvicorn==0.54.0",
  "zarr==3.4.0",
]

[project.scripts]
timed-dataserver = "timed_dataserver.cli:main"

[build-system]
requires = ["uv_build==0.12.23"]
build-backend = "uv_build"
