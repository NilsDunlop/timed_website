[project]
name = "timed-connector"
version = "0.1.0"
description = "Local SSH/Slurm connector for TIMED"
requires-python = ">=3.12"
dependencies = [
  "asyncssh==2.24.1",
  "fastapi==0.142.2",
  "httpx==0.28.1",
  "jinja2==3.1.6",
  "pydantic==2.12.5",
  "pyyaml==6.0.3",
  "timed-dataserver==0.5.0.dev1",
  "uvicorn==0.54.0",
]

[project.scripts]
timed-connector = "timed_connector.cli:main"

[build-system]
requires = ["uv_build==0.12.23"]
build-backend = "uv_build"
